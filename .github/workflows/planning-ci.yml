name: Planning Feature CI
on:
  push:
    branches: ["planning-feature"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run unit tests
        run: npm test
      - name: Validate planning JavaScript syntax
        run: node --check planning.js
      - name: Validate integrated planning JavaScript syntax
        run: node --check planning-integrated.js
      - name: Validate service worker registration syntax
        run: node --check sw-register.js
      - name: Validate planning HTML
        run: npx --yes html-validate planning.html
